name: Build Android APK and Release

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-AutoResponder-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: TG AutoResponder v1.0.0 (APK & EXE)
          body: |
            ## 🚀 TG AutoResponder v1.0.0
            
            В этом релизе доступны обе версии:
            - 📱 **Android**: `app-debug.apk` (автоответчик на входящие сообщения Telegram через уведомления)
            - 💻 **Windows**: `TGAutoResponder-Windows-Standalone.zip` (автоответчик для ПК с поддержкой текста и **любых стикеров**)
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            dist-windows/TGAutoResponder-Windows-Standalone.zip
            dist-windows-lite/TGAutoResponderDesktop.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
