name: Build Android APK and Release

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tgautoresponder -keypass tgautoresponder \
            -dname "CN=TGAutoResponder, OU=Mobile, O=AutoTronix, L=City, ST=State, C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-AutoResponder-Android-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: TG AutoResponder v1.0.2 (Smart Offline Mode & Instant Reply)
          body: |
            ## 🌙 TG AutoResponder v1.0.2 (Smart Offline Mode & Instant Reply)
            
            ### ✨ Что нового в v1.0.2:
            - 🌙 **Умный режим «Только когда не в сети»**:
              - Автоответчик работает **только когда вы не в сети** (экран выключен или телефон заблокирован).
              - Если вы пользуетесь телефоном (в сети) — автоответчик **автоматически отключается** и не мешает.
              - Как только вы блокируете телефон — автоответчик **автоматически включается обратно**!
            - ⚡ **Мгновенный ответ в ту же минуту**:
              - Сообщение пришло: `привет (21:01)`
              - Автоответ ушел: `отвечу позже (21:01)` — сразу без лишних задержек.
            - 👥 **Список чатов людей**: индивидуальная настройка текста или отключение для конкретных контактов.
            - 🌸 **Стиль Pink & Black**: стильный неоновый дизайн.
            - 📱 **Подписанный релизный APK**: `app-release.apk` с официальным сертификатом.
          files: |
            app/build/outputs/apk/release/app-release.apk
            dist-windows/TGAutoResponder-Windows-Standalone.zip
            dist-windows-lite/TGAutoResponderDesktop.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
