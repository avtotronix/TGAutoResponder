name: Build Android APK and Release

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tgautoresponder -keypass tgautoresponder \
            -dname "CN=TGAutoResponder, OU=Mobile, O=AutoTronix, L=City, ST=State, C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-AutoResponder-Android-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: TG AutoResponder v1.0.1 (Pink & Black Edition)
          body: |
            ## 🌸 TG AutoResponder v1.0.1 (Pink & Black Edition)
            
            ### ✨ Новые возможности v1.0.1:
            - 👥 **Список чатов людей**: автоматическое обнаружение входящих личных чатов (каналы и группы автоматически отфильтровываются).
            - ⚙️ **Гибкая настройка ответов**: по умолчанию автоответ включен для всех личных чатов.
            - 💬 **Персональные сообщения**: можно задать индивидуальный текст ответа для конкретного человека!
            - ⛔ **Отключение чатов**: можно выборочно выключить автоответ для любого собеседника в один клик.
            - ➕ **Ручное добавление**: возможность заранее добавить контакт и задать для него правило.
            - 🌸 **Стиль Розово-Черный**: современный неоновый интерфейс Pink & Black.
            - 📱 **Подписанный релизный APK**: `app-release.apk` с официальным сертификатом.
          files: |
            app/build/outputs/apk/release/app-release.apk
            dist-windows/TGAutoResponder-Windows-Standalone.zip
            dist-windows-lite/TGAutoResponderDesktop.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
